<!--form di login-->
{% extends 'catalog/base.html' %}

{% block title %}Accedi a Shopper!{% endblock %}

{% block content %}
<!--css aggiuntivo, unicamente per il form-->
<style>
    .login-card {
        background: white;
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(251, 111, 146, 0.12);
        padding: 40px;
        width: 100%;
        max-width: 420px;
        transition: transform 0.2s;
    }

    .login-logo-circle {
        background-color: var(--shopper-bg);
        color: var(--shopper-pink-dark);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        margin: 0 auto 15px auto;
        border: 3px solid var(--shopper-pink-light);
    }

    .brand-title {
        font-weight: 800;
        font-size: 1.8rem;
        color: var(--shopper-text);
        text-align: center;
        margin-bottom: 5px;
    }

    .brand-subtitle {
        font-size: 0.9rem;
        color: #8a7376;
        text-align: center;
        margin-bottom: 30px;
    }

    .form-control-shopper {
        border: 2px solid var(--shopper-pink-light);
        border-radius: 12px;
        padding: 12px 15px;
        color: var(--shopper-text);
        transition: all 0.2s ease-in-out;
    }
    .form-control-shopper:focus {
        border-color: var(--shopper-pink-dark);
        box-shadow: 0 0 0 3px rgba(251, 111, 146, 0.15);
        color: var(--shopper-text);
        outline: none;
    }

    .form-label-shopper {
        font-weight: 600;
        font-size: 0.9rem;
        margin-left: 5px;
        color: var(--shopper-text);
    }

    .btn-shopper-login {
        background-color: var(--shopper-pink-dark);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px;
        font-weight: 700;
        font-size: 1rem;
        transition: all 0.2s ease-in-out;
        width: 100%;
    }
    .btn-shopper-login:hover {
        background-color: #ff5c8a;
        color: white;
        transform: translateY(-1px);
        box-shadow: 0 5px 15px rgba(251, 111, 146, 0.3);
    }

    .back-link {
        color: var(--shopper-pink-dark);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: color 0.2s;
    }
    .back-link:hover {
        color: #ff5c8a;
        text-decoration: underline;
    }

    .alert-shopper {
        background-color: #fff0f2;
        border: 1px solid #ffccd3;
        color: #d9406b;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 500;
    }
</style>

<div class="d-flex justify-content-center mt-5 mb-5">
    <div class="login-card">

        <div class="login-logo-circle">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>

        <h1 class="brand-title">Shopper!</h1>
        <p class="brand-subtitle">Accedi per gestire il tuo carrello o lo store</p>

        {% if form.errors %}
            <div class="alert alert-shopper d-flex align-items-center mb-4" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
                <div>Username o password non corretti. Riprova!</div>
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %} <div class="mb-3">
                <label for="id_username" class="form-label form-label-shopper">
                    <i class="fa-solid fa-user me-1 opacity-70"></i> Username
                </label>
                <input type="text" name="username" id="id_username"
                       class="form-control form-control-shopper"
                       placeholder="Inserisci il tuo username" required>
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label form-label-shopper">
                    <i class="fa-solid fa-lock me-1 opacity-70"></i> Password
                </label>
                <input type="password" name="password" id="id_password"
                       class="form-control form-control-shopper"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-shopper-login mb-3">
                Accedi <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'product_list' %}" class="back-link">
                <i class="fa-solid fa-arrow-left me-1"></i> Torna alla vetrina prodotti
            </a>
        </div>

    </div>
</div>
{% endblock %}
