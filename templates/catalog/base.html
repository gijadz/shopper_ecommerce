<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Shopper!{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* Tutti i tuoi stili CSS globali che c'erano prima */
        :root {
            --shopper-bg: #fff5f6;
            --shopper-pink-light: #ffe3e7;
            --shopper-pink-main: #ffb3c1;
            --shopper-pink-dark: #fb6f92;
            --shopper-text: #493639;
        }
        body { background-color: var(--shopper-bg); color: var(--shopper-text); font-family: 'Segoe UI', sans-serif; }
        .navbar-shopper { background-color: var(--shopper-pink-main) !important; border-bottom: 3px solid #ffc2d1; }
        .navbar-shopper .navbar-brand { font-weight: 800; font-size: 1.6rem; color: white !important; }
        .brand-icon-pink { color: var(--shopper-pink-dark); margin-right: 12px; font-size: 1.6rem; background-color: white; padding: 8px; border-radius: 50%; border: 2px solid white; }
        .btn-shopper { background-color: var(--shopper-pink-dark); color: white; border: none; font-weight: 600; border-radius: 25px; transition: all 0.2s; }
        .btn-shopper:hover { background-color: #ff5c8a; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-shopper mb-5">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'product_list' %}">
            <i class="fa-solid fa-bag-shopping brand-icon-pink"></i>
            <span>Shopper!</span>
        </a>
        <div class="ms-auto">
            {% block navbar_button %}
            {% endblock %}
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
